services:
  arka-helpdesk-app:
    build: .
    container_name: arka-helpdesk-app
    restart: unless-stopped
    ports:
      - "3006:80"
    depends_on:
      arka-helpdesk-mysql:
        condition: service_healthy
      arka-redis:
        condition: service_started
    networks:
      - arka-network
    volumes:
      - arka_storage:/var/www/storage
    environment:
      - APP_NAME=ARKA HelpDesk
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://100.77.117.2:3006
      - DB_CONNECTION=mysql
      - DB_HOST=arka-helpdesk-mysql
      - DB_PORT=3306
      - DB_DATABASE=arka_helpdesk
      - DB_USERNAME=arka_user
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=arka-redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis

  arka-helpdesk-mysql:
    image: mysql:8.4
    container_name: arka-helpdesk-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=arka_helpdesk
      - MYSQL_USER=arka_user
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - arka_mysql_data:/var/lib/mysql
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arka-network

  arka-redis:
    image: redis:7-alpine
    container_name: arka-redis
    restart: unless-stopped
    networks:
      - arka-network

volumes:
  arka_storage:
  arka_mysql_data:

networks:
  arka-network:
    driver: bridge
